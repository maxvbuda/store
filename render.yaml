services:
  - type: web
    name: shop-agent
    runtime: node
    # Chromium OOMs at launch on the free tier's 512 MB — DEPLOY.md calls for
    # at least 2 GB. NOTE: if this file drives a Blueprint, the plan set here
    # changes what Render bills.
    plan: standard
    # Installs the Node deps, then the Python side (agent browser + Playwright's
    # Chromium) needed by the computer-use console at /. No --with-deps: that
    # flag shells out to apt-get as root, which Render's build sandbox
    # refuses non-interactively ("su: Authentication failure").
    # PLAYWRIGHT_BROWSERS_PATH is load-bearing: only the project directory
    # survives from build to runtime, so Chromium must land inside the repo.
    buildCommand: "npm install && pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=$PWD/.playwright python3 -m playwright install chromium"
    startCommand: node server.js
    envVars:
      # Set the value in the Render dashboard — never commit the key.
      - key: OPENROUTER_API_KEY
        sync: false
      # Required on a public URL: without it /api/llm is an open proxy anyone
      # can bill against the key. Set the value in the dashboard.
      - key: APP_PASSWORD
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-pro
      - key: OPENROUTER_REASONING
        value: medium
      - key: OPENROUTER_MAX_TOKENS
        value: "4000"
      # Supabase project's Settings > API page. Run supabase/schema.sql in
      # the SQL editor once before first use.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
