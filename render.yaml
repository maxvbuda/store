services:
  - type: web
    name: shop-agent
    runtime: node
    plan: free
    # Installs the Node deps, then the Python side (agent browser + Playwright's
    # Chromium) needed by the computer-use console at /.
    buildCommand: "npm install && pip install -r requirements.txt && python3 -m playwright install --with-deps chromium"
    startCommand: node server.js
    envVars:
      # Set the value in the Render dashboard — never commit the key.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-pro
      - key: OPENROUTER_REASONING
        value: medium
      - key: OPENROUTER_MAX_TOKENS
        value: "4000"
      # Supabase project's Settings > API page. Run supabase/schema.sql in
      # the SQL editor once before first use.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
