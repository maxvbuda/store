services:
  - type: web
    name: shop-agent
    runtime: node
    plan: free
    # app/index.html is committed, so no Python build step is needed beyond
    # installing the mongodb driver.
    buildCommand: "npm install"
    startCommand: node server.js
    envVars:
      # Set the value in the Render dashboard — never commit the key.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-pro
      - key: OPENROUTER_REASONING
        value: medium
      - key: OPENROUTER_MAX_TOKENS
        value: "4000"
      # Render's free tier has no managed MongoDB — point this at a hosted
      # cluster (e.g. MongoDB Atlas's free tier) and set it in the dashboard.
      - key: MONGODB_URI
        sync: false
