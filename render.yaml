services:
  - type: web
    name: shop-agent
    runtime: node
    # standard was needed because a *local* Chromium OOMs on the free tier's
    # 512 MB. With KERNEL_API_KEY set, Chromium runs on Kernel's
    # infrastructure instead — nothing heavy runs in this container anymore,
    # so it's worth trying `plan: starter` (or free) again once Kernel is
    # confirmed working; this wasn't downgraded automatically since it's a
    # billing change. NOTE: if this file drives a Blueprint, the plan set
    # here changes what Render bills.
    plan: standard
    # Node deps, then the Python side (agent browser). No `playwright install
    # chromium` anymore: with KERNEL_API_KEY set, the browser runs on
    # Kernel's infrastructure over CDP — only the `playwright` driver package
    # is needed here, not the browser binary itself. If KERNEL_API_KEY is
    # ever unset, the local-Chromium fallback in agent/browser_service.py
    # will correctly report "Chromium is not installed" rather than trying
    # (and OOMing, or hitting the old --with-deps root/apt problem) to launch
    # one in this container.
    buildCommand: "npm install && pip install -r requirements.txt"
    startCommand: node server.js
    envVars:
      # Set the value in the Render dashboard — never commit the key.
      - key: OPENROUTER_API_KEY
        sync: false
      # Required on a public URL: without it /api/llm is an open proxy anyone
      # can bill against the key. Set the value in the dashboard.
      - key: APP_PASSWORD
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-pro
      - key: OPENROUTER_REASONING
        value: medium
      - key: OPENROUTER_MAX_TOKENS
        value: "4000"
      # Supabase project's Settings > API page. Run supabase/schema.sql in
      # the SQL editor once before first use.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # onkernel.com — runs Chromium on Kernel's infrastructure instead of
      # this container. Required for the agent browser to work in production.
      - key: KERNEL_API_KEY
        sync: false
